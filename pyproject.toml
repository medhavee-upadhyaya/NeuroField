[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofield"
version = "1.0.0"
description = "Autonomous Agricultural Robot Agent — AI-powered farm management"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "click>=8.1.7",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
]

[project.scripts]
neurofield = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "simulation*", "api*"]

[tool.setuptools.package-dir]
"" = "."
